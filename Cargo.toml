[workspace]
members = [
    # framework
    "crates/rmc-core",
    "crates/rmc-diagmc",
    "crates/rmc-grids",
    "crates/rmc-io",
    "crates/rmc-numeric",
    "crates/rmc-stats",
    "crates/rmc",
    # example apps (also the perf-regression fixtures, see README)
    "crates/apps/cube-spike",
    "crates/apps/rmc-frohlich",
    "crates/apps/rmc-minimal",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
bincode = "1"
criterion = "0.8"
env_logger = "0.11"
indicatif = "0.18"
log = "0.4"
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
num-complex = "0.4"
proptest = "1.12"
rand = "0.10"
rand_core = "0.10"
rand_distr = "0.6"
rand_xoshiro = "0.8"
rayon = "1"
rmc-core = { path = "crates/rmc-core" }
rmc-diagmc = { path = "crates/rmc-diagmc" }
rmc-grids = { path = "crates/rmc-grids" }
rmc-io = { path = "crates/rmc-io" }
rmc-numeric = { path = "crates/rmc-numeric" }
rmc-stats = { path = "crates/rmc-stats" }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slotmap = { version = "1", features = ["serde"] }
thiserror = "2"

# Fully-optimized build for benchmarking (the "tuned Rust" tier vs C++ -O3).
# Build with: RUSTFLAGS="-C target-cpu=native" cargo build --profile release-tuned -p rmc-frohlich
[profile.release-tuned]
inherits = "release"
lto = "fat"
codegen-units = 1
